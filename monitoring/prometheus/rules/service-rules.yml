groups:
  - name: service-status
    interval: 30s

    rules:
      # Node exporter
      - alert: '[llm]-[test]-[ec2]-[service]-[node-exporter]'
        expr: |
          up{
            job=~"(llm|bastion|web-server)-node-exporter"
          } == 0

        for: 2m

        labels:
          project: llm
          environment: test
          source: prometheus
          component: ec2
          service: node-exporter
          severity: high

        annotations:
          summary: "Node Exporter is down"
          description: >-
            Node Exporter is unavailable on
            {{ $labels.instance_name }}
            ({{ $labels.instance_id }}).

      # Ollama
      - alert: '[llm]-[test]-[ec2]-[service]-[ollama]'
        expr: |
          node_systemd_unit_state{
            job="llm-node-exporter",
            name="ollama.service",
            state="active"
          } == 0

        for: 1m

        labels:
          project: llm
          environment: test
          source: prometheus
          component: ec2
          service: ollama
          severity: high

        annotations:
          summary: "Ollama service is down"
          description: >-
            ollama.service is not active on
            {{ $labels.instance_name }}
            ({{ $labels.instance_id }}).

      # Grafana
      - alert: '[llm]-[test]-[ec2]-[service]-[grafana]'
        expr: |
          node_systemd_unit_state{
            job="web-server-node-exporter",
            name="grafana-server.service",
            state="active"
          } == 0

        for: 1m

        labels:
          project: llm
          environment: test
          source: prometheus
          component: ec2
          service: grafana
          severity: high

        annotations:
          summary: "Grafana service is down"
          description: >-
            grafana-server.service is not active on the web server.

      # Docker
      - alert: '[llm]-[test]-[ec2]-[service]-[docker]'
        expr: |
          node_systemd_unit_state{
            job="web-server-node-exporter",
            name="docker.service",
            state="active"
          } == 0

        for: 1m

        labels:
          project: llm
          environment: test
          source: prometheus
          component: ec2
          service: docker
          severity: high

        annotations:
          summary: "Docker service is down"
          description: >-
            docker.service is not active on the web server.
            Open WebUI may be unavailable.

      # Alert Manager
      - alert: '[llm]-[test]-[ec2]-[service]-[alertmanager]'
        expr: |
          node_systemd_unit_state{
            job="web-server-node-exporter",
            name="alertmanager.service",
            state="active"
          } == 0

        for: 1m

        labels:
          project: llm
          environment: test
          source: prometheus
          component: ec2
          service: alertmanager
          severity: high

        annotations:
          summary: "Alertmanager service is down"
          description: >-
            alertmanager.service is not active on the web server.