apiVersion: 1
groups:
- orgId: 1
  name: Host resources
  folder: Infrastructure
  interval: 1m
  rules:
  - uid: efs5wga6xb0g0d
    title: '[llm]-[test]-[ec2]-[high]-[cpu]'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: |-
          100 * (
            1 -
            avg by (instance, instance_name, instance_id, role) (
              rate(
                node_cpu_seconds_total{
                  job=~"(llm|bastion|web-server)-node-exporter",
                  mode="idle"
                }[5m]
              )
            )
          )
        hide: false
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 90
            - 0
            type: gt
          operator:
            type: and
          query:
            params: []
          reducer:
            params: []
            type: avg
          type: query
        datasource:
          name: Expression
          type: __expr__
          uid: __expr__
        expression: A
        hide: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      component: ec2
      environment: test
      metric: cpu
      project: llm
      severity: high
      source: grafana
    isPaused: false
