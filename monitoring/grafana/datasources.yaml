apiVersion: 1

datasources:
  - name: AWS CloudWatch
    uid: cloudwatch
    type: CloudWatch
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      authType: default
      defaultRegion: eu-central-1

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: false
    editable: true